name: Build mini OS ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: コードのチェックアウト
      uses: actions/checkout@v4

    - name: 必要なツールの準備
      run: |
        sudo apt-get update
        sudo apt-get install -y xorriso wget qemu-system-x86 imagemagick squashfs-tools

    - name: mini OS (完全統合版ISO) のビルド
      run: |
        mkdir -p build iso_root/boot/syslinux iso_root/apks/x86_64 overlay/root

        # 1. 画面設定ファイル (~/.xinitrc) の配置
        cat << 'EOF' > overlay/root/.xinitrc
        export LIBGL_ALWAYS_SOFTWARE=1
        xsetroot -solid "#1e1e2e"
        tint2 &
        exec openbox
        EOF

        # 2. 自動ログイン時に即GUIを立ち上げる設定
        cat << 'EOF' > overlay/root/.profile
        if [ "$(tty)" = "/dev/tty1" ]; then
            exec startx
        fi
        EOF

        # 3. 設定アーカイブ (apkovl) 作成
        cd overlay && tar -czf ../build/localhost.apkovl.tar.gz . && cd ..

        # 4. Alpine Linux公式の最新Live ISOを取得
        ALPINE_VER="3.19.1"
        ISO_NAME="alpine-standard-${ALPINE_VER}-x86_64.iso"
        wget -q "https://dl-cdn.alpinelinux.org/alpine/v3.19/releases/x86_64/${ISO_NAME}"

        # 5. 元のISOからブート構成を維持したまま、設定ファイルを直結
        xorriso -indev "${ISO_NAME}" \
                -outdev build/mini-os-x86_64.iso \
                -map build/localhost.apkovl.tar.gz /localhost.apkovl.tar.gz \
                -boot_image any replay

        echo "=== mini OS 完全ビルド完了 ==="

    - name: mini OS を起動してデスクトップ画面を撮影
      run: |
        # 起動後、OSが立ち上がるまで30秒待って撮影（今回はネット通信なし）
        (sleep 30; echo "screendump screenshot.ppm"; sleep 2; echo "quit") | \
        qemu-system-x86_64 -cdrom build/mini-os-x86_64.iso \
          -m 1024 -smp 2 \
          -display none -monitor stdio

        convert screenshot.ppm screenshot.png

    - name: 完成したISOと写真を保存
      uses: actions/upload-artifact@v4
      with:
        name: mini-os-result
        path: |
          build/mini-os-x86_64.iso
          screenshot.png
