name: Build mini OS ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: コードのチェックアウト
      uses: actions/checkout@v4

    - name: 必要なツールの準備
      run: |
        sudo apt-get update
        sudo apt-get install -y xorriso wget qemu-system-x86 imagemagick

    - name: mini OS (完全オフライン組み込みISO) のビルド
      run: |
        mkdir -p build overlay/etc/local.d overlay/root overlay/etc/runlevels/default apks_cache

        # 1. デスクトップ環境の自動起動スクリプト
        cat << 'EOF' > overlay/root/.xinitrc
        export LIBGL_ALWAYS_SOFTWARE=1
        xsetroot -solid "#1e1e2e"
        tint2 &
        exec openbox
        EOF

        # 2. 起動時にGUIを立ち上げる設定
        cat << 'EOF' > overlay/etc/local.d/gui.start
        #!/bin/sh
        # パッケージをオフライン（CD内）から即座に展開
        apk add --no-network /media/cdrom/apks/x86_64/*.apk 2>/dev/null || true
        # X11 (GUI) を自動起動
        startx /root/.xinitrc -- :0 &
        EOF
        chmod +x overlay/etc/local.d/gui.start

        ln -sf /etc/init.d/local overlay/etc/runlevels/default/local

        # 3. 設定アーカイブ (apkovl) 作成
        cd overlay && tar -czf ../build/localhost.apkovl.tar.gz . && cd ..

        # 4. AlpineベースISOの取得と展開
        ALPINE_VER="3.19.1"
        ISO_NAME="alpine-standard-${ALPINE_VER}-x86_64.iso"
        wget -q "https://dl-cdn.alpinelinux.org/alpine/v3.19/releases/x86_64/${ISO_NAME}"

        mkdir -p iso_extracted
        xorriso -osirrox on -indev "${ISO_NAME}" -extract / iso_extracted/
        chmod -R +w iso_extracted/

        # 5. 【超重要】必要なGUIパッケージ群をビルド時に丸ごとダウンロードしてISO内に格納
        docker run --rm -v $(pwd):/workspace alpine:3.19 sh -c "
          echo 'https://dl-cdn.alpinelinux.org/alpine/v3.19/main' > /etc/apk/repositories
          echo 'https://dl-cdn.alpinelinux.org/alpine/v3.19/community' >> /etc/apk/repositories
          apk update
          # 画面表示に必要な最小限の部品をローカルに一括取得
          mkdir -p /workspace/iso_extracted/apks/x86_64
          cd /workspace/iso_extracted/apks/x86_64
          apk fetch -R xorg-server xf86-video-modesetting xf86-video-vesa xinit openbox tint2 xterm
        "

        # 6. mini OS の設定ファイルをISOに配置
        cp build/localhost.apkovl.tar.gz iso_extracted/

        # 7. 元の起動システムを完全維持して mini-os-x86_64.iso を再パッケージ
        xorriso -indev "${ISO_NAME}" \
                -outdev build/mini-os-x86_64.iso \
                -map iso_extracted/apks /apks \
                -map build/localhost.apkovl.tar.gz /localhost.apkovl.tar.gz \
                -boot_image any replay

        echo "=== mini OS 完全ビルド完了 ==="

    - name: mini OS を起動してデスクトップ画面を撮影
      run: |
        # オフラインなので即起動。45秒で十分立ち上がります
        (sleep 45; echo "screendump screenshot.ppm"; sleep 2; echo "quit") | \
        qemu-system-x86_64 -cdrom build/mini-os-x86_64.iso \
          -m 1024 -smp 2 \
          -display none -monitor stdio

        convert screenshot.ppm screenshot.png

    - name: 完成したISOと写真を保存
      uses: actions/upload-artifact@v4
      with:
        name: mini-os-result
        path: |
          build/mini-os-x86_64.iso
          screenshot.png
