name: Build mini OS ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: コードのチェックアウト
      uses: actions/checkout@v4

    - name: 必要なツールの準備
      run: |
        sudo apt-get update
        sudo apt-get install -y xorriso wget

    - name: mini OS (本番ISO) のビルド
      run: |
        mkdir -p build overlay/etc/local.d overlay/root

        # 1. 起動スクリプトの配置
        cp config/setup.sh overlay/etc/local.d/setup.start
        chmod +x overlay/etc/local.d/setup.start
        cp config/xinitrc overlay/root/.xinitrc

        # 2. 自動設定アーカイブ (apkovl) の作成
        cd overlay
        tar -czf ../build/localhost.apkovl.tar.gz .
        cd ..

        # 3. Alpine Linux公式のベースISOを取得
        ALPINE_VER="3.19.1"
        ISO_NAME="alpine-standard-${ALPINE_VER}-x86_64.iso"
        wget -q "https://dl-cdn.alpinelinux.org/alpine/v3.19/releases/x86_64/${ISO_NAME}"

        # 4. 元のISOの起動構造を維持したまま mini OS の設定を注入
        xorriso -indev "${ISO_NAME}" \
                -outdev build/mini-os-x86_64.iso \
                -map build/localhost.apkovl.tar.gz /localhost.apkovl.tar.gz \
                -boot_image any replay

        echo "=== mini OS ISO ビルド完了 ==="

    - name: 完成したISOをダウンロード可能にする
      uses: actions/upload-artifact@v4
      with:
        name: mini-os-x86_64-iso
        path: build/mini-os-x86_64.iso
