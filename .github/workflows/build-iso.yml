name: Build mini OS ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: コードのチェックアウト
      uses: actions/checkout@v4

    - name: 必要なツールの準備
      run: |
        sudo apt-get update
        sudo apt-get install -y xorriso wget qemu-system-x86 imagemagick

    - name: mini OS (本番ISO) のビルド
      run: |
        mkdir -p build overlay/etc/local.d overlay/root overlay/etc/runlevels/default

        # 起動スクリプトの配置（確実にネットに繋ぐ処理を追加）
        cat << 'EOF' > overlay/etc/local.d/setup.start
        #!/bin/sh
        # ネット接続を即座に確立
        udhcpc -i eth0 -n -q 2>/dev/null || true
        # メインのセットアップ実行
        /bin/sh /root/setup.sh > /tmp/setup.log 2>&1
        EOF
        chmod +x overlay/etc/local.d/setup.start

        cp config/setup.sh overlay/root/setup.sh
        cp config/xinitrc overlay/root/.xinitrc

        # 自動起動サービスの登録
        ln -sf /etc/init.d/local overlay/etc/runlevels/default/local

        # 自動ログイン設定
        cat << 'EOF' > overlay/etc/inittab
        ::sysinit:/sbin/openrc sysinit
        ::sysinit:/sbin/openrc boot
        ::wait:/sbin/openrc default
        tty1::respawn:/sbin/getty -n -l /bin/sh 38400 tty1
        ::ctrlaltdel:/sbin/reboot
        ::shutdown:/sbin/openrc shutdown
        EOF

        echo '[ "$(tty)" = "/dev/tty1" ] && exec startx' >> overlay/root/.profile

        # 自動設定アーカイブ作成
        cd overlay && tar -czf ../build/localhost.apkovl.tar.gz . && cd ..

        # AlpineベースISO取得と合成
        ALPINE_VER="3.19.1"
        ISO_NAME="alpine-standard-${ALPINE_VER}-x86_64.iso"
        wget -q "https://dl-cdn.alpinelinux.org/alpine/v3.19/releases/x86_64/${ISO_NAME}"

        xorriso -indev "${ISO_NAME}" \
                -outdev build/mini-os-x86_64.iso \
                -map build/localhost.apkovl.tar.gz /localhost.apkovl.tar.gz \
                -boot_image any replay

    - name: mini OS を自動起動して画面の写真を撮る
      run: |
        # 160秒じっくり待ってから撮影
        (sleep 160; echo "screendump screenshot.ppm"; sleep 2; echo "quit") | \
        qemu-system-x86_64 -cdrom build/mini-os-x86_64.iso \
          -m 2048 -smp 2 \
          -net nic,model=virtio -net user \
          -display none -monitor stdio

        # 画像をPNGに変換
        convert screenshot.ppm screenshot.png

    - name: 完成したISOと写真を保存
      uses: actions/upload-artifact@v4
      with:
        name: mini-os-result
        path: |
          build/mini-os-x86_64.iso
          screenshot.png
